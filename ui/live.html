<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Puffer Party Live</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { font-size: 13px; }
    #live { padding: 12px; display: grid; gap: 12px; }
    .sec { border-top: 1px solid var(--line); padding-top: 10px; }
    .sec h2 { font-size: 12px; color: var(--ink-2); margin: 0 0 6px; display: flex; justify-content: space-between; }
    .top { display: flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 12px; }
    .top .dot { display: inline-flex; }
    .question { font-size: 17px; font-weight: 600; line-height: 1.3; margin: 0; }
    .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .big { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .track { position: relative; height: 8px; background: var(--grid); border-radius: 4px; overflow: hidden; margin-top: 4px; }
    .fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 4px; }
    .zone { position: absolute; top: 0; bottom: 0; background: var(--bad); opacity: 0.18; }
    .fuse .fill { background: var(--ink-2); }
    .fuse.hot .fill { background: var(--bad); }
    .note { color: var(--ink-2); font-size: 12px; margin-top: 4px; }
    .hot-text { color: var(--bad); font-weight: 600; }
    .players { display: grid; gap: 4px; }
    .player { display: grid; grid-template-columns: 1fr auto 64px; gap: 8px; align-items: center; }
    .player.me .pname { font-weight: 600; }
    .player.out { opacity: 0.45; }
    .player.holder .pname::after { content: " ●"; color: var(--bad); }
    .pname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pname small { color: var(--muted); font-weight: 400; margin-left: 4px; }
    .lives { color: var(--bad); letter-spacing: 1px; font-size: 11px; white-space: nowrap; }
    .meter { height: 6px; background: var(--grid); border-radius: 3px; overflow: hidden; }
    .meter span { display: block; height: 100%; background: var(--accent); }
    .wait { color: var(--ink-2); padding: 24px 0; text-align: center; }
    form.name { display: flex; gap: 6px; }
    form.name input { flex: 1; }
  </style>
</head>
<body>
  <div id="live"><div class="wait">Connecting…</div></div>
  <script src="common.js"></script>
  <script src="live.js"></script>
</body>
</html>
